# Run from repo root: docker compose --project-directory . -f infra/vultr/control.yml up -d --build
name: skg-control
x-app: &app
  image: skg-service:local
  build: {context: ., dockerfile: infra/docker/service.Dockerfile}
  env_file: .env
  networks: [control]
  restart: unless-stopped
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: guard
      POSTGRES_USER: guard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required}
    volumes: [database:/var/lib/postgresql/data]
    networks: [control]
    healthcheck: {test: [CMD-SHELL, "pg_isready -U guard"], interval: 5s, retries: 20}
    restart: unless-stopped
  migrate:
    <<: *app
    command: [sh, -c, "alembic upgrade head && python -m guard.bootstrap"]
    restart: "no"
    depends_on:
      db: {condition: service_healthy}
  api:
    <<: *app
    volumes: [artifacts:/data/artifacts]
    depends_on:
      migrate: {condition: service_completed_successfully}
  orchestrator:
    <<: *app
    command: [python, -m, guard.orchestration]
    volumes: [artifacts:/data/artifacts]
    depends_on:
      migrate: {condition: service_completed_successfully}
  web:
    build: {context: ., dockerfile: infra/docker/web.Dockerfile}
    networks: [control]
    depends_on: [api]
    restart: unless-stopped
  tls:
    image: caddy:2-alpine
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?Required}
    ports: ["80:80", "443:443"]
    volumes:
      - ./infra/vultr/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [control]
    restart: unless-stopped
volumes:
  database:
  artifacts:
  caddy_data:
  caddy_config:
networks:
  control:

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "skeleton-key-guard"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<2.2",
  "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3", "python-multipart>=0.0.20,<1",
  "argon2-cffi>=23,<26", "jinja2>=3.1.6,<4", "docker>=7,<8"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "playwright==1.63.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["guard*", "portal*", "worker*", "runner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["docker: requires Linux Docker and the full compose stack", "browser: actual local browser, not container isolation"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
